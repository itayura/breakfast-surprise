<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מה בא לך בבוקר?</title><style>body{margin:0;background:#f7f3ec;color:#252320;font-family:Arial;text-align:center}.hero{padding:90px 20px 50px}.hero h1{font-size:clamp(60px,12vw,130px);line-height:.9;margin:25px}.hero em{color:#dd6b45;font-family:Georgia}.builder{max-width:900px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choice,.pill{padding:18px;border:1px solid #ddd5c8;border-radius:10px;background:#fffaf3;cursor:pointer;font-size:16px}.selected,.choice:hover,.pill:hover{border:2px solid #dd6b45;background:#fff6ed}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.receipt{margin-top:35px;padding:24px;background:#9baa87;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.send,.modal button{background:#252320;color:white;border:0;border-radius:30px;padding:14px 24px;cursor:pointer}.easter{position:fixed;top:20px;left:20px;border:0;background:none;color:#aaa;cursor:pointer}.modal-bg{position:fixed;inset:0;background:#000a;display:grid;place-items:center}.modal{background:#f7f3ec;padding:45px;border-radius:12px}.modal em{color:#dd6b45}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.receipt{flex-direction:column;gap:15px}}</style><body><button class="easter" onclick="surprise()">יום כיף 18.6</button><section class="hero"><div>בוקר טוב, אהובה</div><h1>מה בא לך<br><em>בבוקר?</em></h1><p>הרכיבי את ארוחת הבוקר המושלמת שלך.<br>אני כבר דואג לכל השאר.</p></section><section class="builder"><h2>מתחילות בעיקר</h2><p>בחירה אחת, כי אי אפשר לאכול הכול. או שכן?</p><div class="cards" id="cards"></div><h2>פינישים קטנים</h2><div class="pills" id="pills"></div><textarea id="note" placeholder="בקשה מיוחדת? ספרי לי משהו קטן..." style="width:100%;min-height:80px;padding:12px"></textarea><aside class="receipt"><h3 id="summary">עוד לא בחרת כלום...</h3><button class="send" onclick="send()">שלחי לי ↗</button></aside></section><script>let c='';const a=['שקשוקה חמה','קרואסון חמאה','טוסט אבוקדו','פנקייקים רכים','קפה הפוך','מיץ תפוזים','תה נענע','שייק פירות'],e=['ביצה רכה','גבינת שמנת','סלמון מעושן','פירות העונה','ממרח שוקולד'];cards.innerHTML=a.map((x,i)=>'<button class="choice" onclick="pick(this,\''+x+'\')">'+x+'</button>').join('');pills.innerHTML=e.map(x=>'<button class="pill" onclick="pick(null,\''+x+'\')">+ '+x+'</button>').join('');function pick(el,x){if(el){document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');c=x}else c=c?c+' + '+x:x;summary.textContent=c}function send(){location.href='mailto:itayura@gmail.com?subject='+encodeURIComponent('בחירת ארוחת הבוקר שלי')+'&body='+encodeURIComponent(c+'\n'+note.value)}function surprise(){document.body.insertAdjacentHTML('beforeend','<div class="modal-bg" onclick="this.remove()"><div class="modal"><h2>חשבתי שאת<br><em>אוהבת הפתעות</em></h2><p>אז תשמרי את התאריך ❤️</p><button class="send">סגור, אני מחכה</button></div></div>')}</script></body></html>
