];let active='הכול',selected=[];const cats=['הכול',...new Set(meals.map(x=>x[0]))];tabs.innerHTML=cats.map(x=>'<button class="tab '+(x===active?'active':'')+'" onclick="filterCat(\''+x+'\')">'+x+'</button>').join('');function filterCat(c){active=c;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent===c));render()}function render(){grid.innerHTML=meals.filter(x=>active==='הכול'||x[0]===active).map((m,i)=>'<article class="card" onclick="openMeal('+i+')"><img src="'+imgs[m[4]]+'" alt="'+m[1]+'"><div class="card-body"><span class="card-meta">'+m[0]+'</span><h3>'+m[1]+'</h3><p>'+m[2]+'</p><div class="card-foot"><span class="price">'+m[3]+'</span><span class="custom">התאמה אישית ＋</span></div></div></article>').join('')}function openMeal(i){const m=meals[i];document.body.insertAdjacentHTML('beforeend','<div class="drawer-bg" onclick="closeDrawer(event)"><aside class="drawer" onclick="event.stopPropagation()"><img src="'+imgs[m[4]]+'"><h2>'+m[1]+'</h2><p>'+m[2]+'</p><h4>איך את אוהבת?</h4><div class="mods"><button class="mod locked" disabled>בצל — קבוע בכל מנה 🔒</button>'+m[5].map(x=>'<button class="mod" onclick="this.classList.toggle(\'on\')">'+x+'</button>').join('')+'</div><div class="locked-note">אי אפשר להסיר את הבצל. יש דברים שפשוט חייבים להיות.</div><div class="drawer-actions"><button class="ghost" onclick="closeDrawer()">ביטול</button><button class="send" onclick="addMeal('+i+')">הוסיפי לבחירה</button></div></aside></div>')}function closeDrawer(e){if(!e||e.target.classList.contains('drawer-bg'))document.querySelector('.drawer-bg')?.remove()}function addMeal(i){const m=meals[i],mods=[...document.querySelectorAll('.mod.on')].map(x=>x.textContent);selected.push(m[1]+' — בצל קבוע'+(mods.length?' ('+mods.join(', ')+')':''));chosen.textContent=selected.join(' · ');send.disabled=false;closeDrawer()}function sendOrder(){const body='היי איתי,\n\nבחרתי:\n'+selected.map(x=>'• '+x).join('\n')+'\n\nאת ממש אוהבת בצל הא? 🧅';location.href='mailto:
