<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בוקר טוב, אהובה — תפריט הבוקר שלך</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet"><style>
:root{--cream:#faf7f1;--paper:#fffdf9;--ink:#292722;--muted:#8d877c;--orange:#dc6d4a;--sage:#a8b899;--line:#e7e0d5;--shadow:0 18px 50px #553d2520}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Heebo,Arial,sans-serif}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:auto;padding:0 24px;color:var(--muted);font-size:13px}.brand{font-weight:800;color:var(--ink);font-size:16px}.brand b{color:var(--orange)}.easter{border:0;background:none;color:#aaa196;font:inherit;cursor:pointer}.hero{max-width:1180px;margin:auto;min-height:410px;padding:58px 24px 70px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px}.kicker{color:var(--orange);font-weight:800;letter-spacing:.04em}.hero h1{font-size:clamp(58px,8vw,110px);line-height:.9;letter-spacing:-4px;margin:22px 0}.hero h1 em,.modal em{color:var(--orange);font-family:'Playfair Display',serif}.hero p{color:var(--muted);font-size:18px;line-height:1.8;margin:0}.hero-art{height:290px;border-radius:28px 28px 90px 28px;background:linear-gradient(140deg,#d8a376cc,#edd4b1aa),url('https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85') center/cover;box-shadow:var(--shadow);transform:rotate(2deg);position:relative}.hero-art:after{content:'בוקר של פינוק';position:absolute;bottom:18px;right:18px;background:#fffdf9e8;padding:8px 16px;border-radius:30px;font-size:13px}.menu{max-width:1180px;margin:auto;padding:0 24px 90px}.menu-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}.menu-head h2{font-size:36px;margin:0}.menu-head p{color:var(--muted);margin:5px 0 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 28px}.tab{border:1px solid var(--line);background:transparent;border-radius:40px;padding:9px 18px;font:15px Heebo;color:var(--muted);cursor:pointer}.tab.active,.tab:hover{background:var(--ink);color:white;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #553d2508;transition:.25s;cursor:pointer}.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.card img{width:100%;height:190px;display:block;object-fit:cover}.card-body{padding:17px 18px 19px}.card-meta{font-size:12px;color:var(--orange);font-weight:800}.card h3{font-size:22px;margin:3px 0}.card p{color:var(--muted);font-size:14px;line-height:1.5;min-height:42px;margin:0 0 14px}.card-foot{display:flex;justify-content:space-between;align-items:center}.price{font-size:13px;color:var(--muted)}.custom{color:var(--orange);font-size:13px;font-weight:700}.selection{position:sticky;bottom:18px;margin:32px auto 0;max-width:800px;background:var(--sage);padding:18px 22px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:var(--shadow)}.selection small{color:#47553d}.selection h3{margin:3px 0 0;font-size:18px}.send,.modal button{border:0;border-radius:40px;background:var(--ink);color:white;padding:13px 24px;font:700 15px Heebo;cursor:pointer}.send:disabled{opacity:.4}.modal-bg{position:fixed;inset:0;background:#221f1bd9;display:grid;place-items:center;padding:20px;z-index:5}.modal{max-width:470px;width:100%;background:var(--cream);border-radius:20px;padding:42px;text-align:center;box-shadow:var(--shadow)}.modal h2{font-size:40px;line-height:1.1;margin:8px 0}.modal p{color:var(--muted)}.modal .close{margin-top:15px}.drawer-bg{position:fixed;inset:0;background:#221f1b99;z-index:4;display:flex;justify-content:flex-start}.drawer{background:var(--paper);width:min(480px,100%);height:100%;padding:32px;overflow:auto;box-shadow:var(--shadow)}.drawer img{width:100%;height:220px;object-fit:cover;border-radius:14px}.drawer h2{font-size:30px;margin:17px 0 4px}.drawer p{color:var(--muted);line-height:1.6}.drawer h4{margin:25px 0 9px}.mods{display:flex;gap:8px;flex-wrap:wrap}.mod{border:1px solid var(--line);background:transparent;border-radius:30px;padding:9px 14px;font:14px Heebo;cursor:pointer}.mod.on{border-color:var(--orange);background:#fff0e8;color:var(--orange)}.drawer-actions{display:flex;gap:10px;margin-top:26px}.drawer-actions button{flex:1}.ghost{border:1px solid var(--line);background:transparent;border-radius:40px;font:700 15px Heebo;cursor:pointer}footer{text-align:center;color:var(--muted);padding:42px;font-size:13px}footer b{color:var(--orange)}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:35px}.hero-art{height:230px;order:-1}.grid{grid-template-columns:repeat(2,1fr)}.menu-head{display:block}.selection{margin-inline:0}}@media(max-width:540px){.topbar{padding:0 16px}.hero,.menu{padding-inline:16px}.hero h1{letter-spacing:-2px}.grid{grid-template-columns:1fr}.card img{height:205px}.selection{flex-direction:column;align-items:stretch}.selection .send{width:100%}}
</style></head><body><header class="topbar"><div class="brand">בוקר <b>טוב</b> ♥</div><button class="easter" onclick="showSurprise()">יום כיף 18.6</button></header><main><section class="hero"><div><div class="kicker">תפריט אישי, רק בשבילך</div><h1>מה בא לך<br><em>בבוקר?</em></h1><p>הרכיבי את הארוחה המושלמת שלך.<br>כל מנה מגיעה בדיוק כמו שאת אוהבת.</p></div><div class="hero-art"></div></section><section class="menu"><div class="menu-head"><div><h2>בוחרים את הווייב</h2><p>מנות ישראליות, קלאסיקות של בית קפה, וקצת פינוקים.</p></div><div class="price">הכול נתון לשינויים ♥</div></div><nav class="tabs" id="tabs"></nav><div class="grid" id="grid"></div><div class="selection"><div><small>הבחירה שלך</small><h3 id="chosen">עוד לא בחרת מנה</h3></div><button class="send" id="send" disabled onclick="sendOrder()">שלחי לי את הבחירה ↗</button></div></section></main><footer>נבנה במיוחד בשבילך <b>♥</b></footer><script>
const meals=[
{id:'israeli',cat:'ישראלי',name:'בוקר ישראלי',desc:'שתי ביצים לבחירה, סלט קצוץ, גבינות, טחינה, לחם ומטבלים.',price:'74 ₪',img:'https://images.unsplash.com/photo-1506084868230-bb9d95c24759?auto=format&fit=crop&w=900&q=85',mods:['חביתה','מקושקשת','עין','פטריות','פטה','לחם ללא גלוטן']},
{id:'shak',cat:'ישראלי',name:'שקשוקה של בוקר',desc:'רוטב עגבניות פיקנטי, ביצים, טחינה, סלט ולחם חם לטבילה.',price:'64 ₪',img:'https://images.unsplash.com/photo-1579954115545-a95591f28bfc?auto=format&fit=crop&w=900&q=85',mods:['לא חריף','חריף אש','פטה מעל','חלומי','טחינה בצד','לחם מלא']},
{id:'bourekas',cat:'ישראלי',name:'בורקס פינוקים',desc:'בורקס גבינה חם עם ביצה קשה, טחינה, מלפפון חמוץ וסלטון.',price:'44 ₪',img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=85',mods:['גבינה','תפוח אדמה','ביצה בצד','טחינה חריפה']},
{id:'benedict',cat:'בית קפה',name:'קרואסון בנדיקט',desc:'קרואסון חמאה, תרד, ביצים עלומות ורוטב הולנדז קרמי.',price:'68 ₪',img:'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=900&q=85',mods:['סלמון מעושן','אבוקדו','בלי תרד','רוטב בצד']},
{id:'avocado',cat:'בית קפה',name:'טוסט אבוקדו',desc:'לחם מחמצת קלוי, אבוקדו, ביצת עין, צ׳ילי ולימון.',price:'58 ₪',img:'https://images.unsplash.com/photo-1541519227354-08fa5d50c44d?auto=format&fit=crop&w=900&q=85',mods:['ביצה מקושקשת','פטה','סלמון','בלי חריף','לחם ללא גלוטן']},
{id:'croissant',cat:'מתוק',name:'פנקייקים רכים',desc:'מגדל פנקייקים חמים עם פירות, מייפל וקצפת וניל.',price:'52 ₪',img:'https://images.unsplash.com/photo-1528207776546-365bb710ee93?auto=format&fit=crop&w=900&q=85',mods:['בננה','תותים','שוקולד','בלי קצפת','מייפל בצד']},
{id:'vegan',cat:'קליל',name:'קערת בוקר',desc:'יוגורט, גרנולה, פירות העונה, טחינה גולמית ודבש.',price:'48 ₪',img:'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=900&q=85',mods:['יוגורט טבעוני','בלי דבש','חמאת בוטנים','תוספת גרנולה']},
{id:'jahnun',cat:'ישראלי',name:'ג׳חנון של שבת',desc:'שני ג׳חנונים חמימים, ביצה, עגבנייה מרוסקת וסחוג.',price:'46 ₪',img:'https://images.unsplash.com/photo-1565299507177-b0ac66763828?auto=format&fit=crop&w=900&q=85',mods:['סחוג בצד','בלי חריף','ביצה קשה','טחינה']}
];let current=null,active='הכול',chosen=[];const cats=['הכול',...new Set(meals.map(m=>m.cat))];tabs.innerHTML=cats.map(x=>'<button class="tab '+(x===active?'active':'')+'" onclick="filterCat(\''+x+'\')">'+x+'</button>').join('');function filterCat(c){active=c;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.textContent===c));render()}function render(){grid.innerHTML=meals.filter(m=>active==='הכול'||m.cat===active).map(m=>'<article class="card" onclick="openMeal(\''+m.id+'\')"><img src="'+m.img+'" alt="'+m.name+'"><div class="card-body"><span class="card-meta">'+m.cat+'</span><h3>'+m.name+'</h3><p>'+m.desc+'</p><div class="card-foot"><span class="price">'+m.price+'</span><span class="custom">התאמה אישית ＋</span></div></div></article>').join('')}function openMeal(id){current=meals.find(m=>m.id===id);document.body.insertAdjacentHTML('beforeend','<div class="drawer-bg" onclick="closeDrawer(event)"><aside class="drawer" onclick="event.stopPropagation()"><img src="'+current.img+'"><h2>'+current.name+'</h2><p>'+current.desc+'</p><h4>איך את אוהבת?</h4><div class="mods">'+current.mods.map(x=>'<button class="mod" onclick="this.classList.toggle(\'on\')">'+x+'</button>').join('')+'</div><div class="drawer-actions"><button class="ghost" onclick="closeDrawer()">ביטול</button><button class="send" onclick="addMeal()">הוסיפי לבחירה</button></div></aside></div>')}function closeDrawer(e){if(!e||e.target.classList.contains('drawer-bg'))document.querySelector('.drawer-bg')?.remove()}function addMeal(){const mods=[...document.querySelectorAll('.mod.on')].map(x=>x.textContent);chosen=[current.name+(mods.length?' ('+mods.join(', ')+')':'')];chosenText();document.querySelector('.drawer-bg')?.remove()}function chosenText(){chosenEl=document.getElementById('chosen');chosenEl.textContent=chosen.join(' · ');document.getElementById('send').disabled=!chosen.length}function sendOrder(){location.href='mailto:itayura@gmail.com?subject='+encodeURIComponent('בחירת ארוחת הבוקר שלי')+'&body='+encodeURIComponent('היי איתי,\n\nבחרתי: '+chosen.join('\n')+'\n\nאני מחכה לבוקר ☕')}function showSurprise(){document.body.insertAdjacentHTML('beforeend','<div class="modal-bg" onclick="this.remove()"><div class="modal" onclick="event.stopPropagation()"><h2>חשבתי שאת<br><em>אוהבת הפתעות</em></h2><p>אז תשמרי את התאריך ❤️</p><button class="send close" onclick="this.closest(\'.modal-bg\').remove()">סגור, אני מחכה</button></div></div>')}render();
</script></body></html>
